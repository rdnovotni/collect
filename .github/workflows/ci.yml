name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit
      - name: Check the standard's own files
        run: collect check-standard --strict
      - name: Validate examples
        run: collect validate --strict examples/postcard examples/sports-card examples/coin examples/stamp examples/package
      - name: Tests
        run: pytest -q
